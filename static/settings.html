<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Threat Detection Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/dashboard.css" rel="stylesheet">
    <script src="/static/theme.js"></script>
</head>

<body>
<div id="topNav"></div>
<script src="/static/nav.js?v=2"></script>

<header class="app-header text-white py-4 mb-4">
    <div class="container">
        <h1 class="h2 mb-1">Settings</h1>
        <p class="mb-0 text-light opacity-75">Appearance and system status</p>
    </div>
</header>

<main class="container pb-4">
    <section class="card shadow-sm mb-4"><div class="card-body">
        <h2 class="h6 mb-3">Appearance</h2>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="theme" id="themeLight" value="light">
            <label class="form-check-label" for="themeLight">Light</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="theme" id="themeDark" value="dark">
            <label class="form-check-label" for="themeDark">Dark</label>
        </div>
        <div class="small text-muted mt-2">Your choice is saved in this browser and used on every page.</div>
    </div></section>

    <section class="card shadow-sm"><div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h6 mb-0">System status</h2>
            <button id="statusRefresh" class="btn btn-outline-secondary btn-sm" type="button">Check again</button>
        </div>
        <div id="statusError" class="alert alert-danger d-none" role="alert"></div>
        <table class="table mb-0">
            <tbody>
                <tr><th scope="row">API (GET /health)</th><td id="statusApi">Checking...</td></tr>
                <tr><th scope="row">Alerts stored</th><td id="statusAlerts">-</td></tr>
                <tr><th scope="row">Rules with alerts</th><td id="statusRules">-</td></tr>
                <tr><th scope="row">API documentation</th><td><a href="/docs" target="_blank" rel="noopener">/docs</a></td></tr>
            </tbody>
        </table>
    </div></section>
</main>

<script src="/static/settings.js"></script>
</body>
</html>
